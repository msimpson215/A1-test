<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A1 Asphalt & Sealing</title>
  <!-- voxtalk-build: 20260612-v12-noise-filter -->

  <style>
    :root{
      --bg1:#252525;
      --bg2:#000000;
      --yellow:#F5C518;
      --muted: rgba(245,197,24,0.70);
      --muted2: rgba(245,197,24,0.45);
      --stroke: rgba(245,197,24,0.22);
      --panel: rgba(0,0,0,0.25);
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--yellow);
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 300;
      overflow: hidden;
      user-select: none;
    }

    #overlay{
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    #panel{
      width: min(460px, calc(100vw - 44px));
      border-radius: 18px;
      padding: 18px 18px 14px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #headline {
      font-size: 0.98rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
      color: var(--muted);
      padding: 0 6px;
      min-height: 2.4em;
      display: grid;
      place-items: center;
    }
    .hide-soft { visibility: hidden; }

    #orb-container {
      width: 220px;
      height: 220px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: url('/A1__asphalt_logo.jpeg') center / 70% no-repeat;
      background-color: #111;
      border: 3px solid var(--yellow);
      box-shadow:
        0 0 60px rgba(245, 197, 24, 0.4),
        0 0 120px rgba(245, 197, 24, 0.15),
        0 0 200px rgba(245, 197, 24, 0.08);
      transform: scale(1);
      animation: orbPulse 3s ease-in-out infinite;
      transition: transform 260ms ease, box-shadow 260ms ease, border-color 260ms ease;
    }

    #orb-container:hover .orb {
      transform: scale(1.03);
    }

    body.active .orb {
      animation: orbActive 1.35s infinite alternate ease-in-out;
    }

    @keyframes orbPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 60px rgba(245, 197, 24, 0.4),
          0 0 120px rgba(245, 197, 24, 0.15),
          0 0 200px rgba(245, 197, 24, 0.08);
        border-color: var(--yellow);
      }
      50% {
        transform: scale(1.05);
        box-shadow:
          0 0 80px rgba(245, 197, 24, 0.6),
          0 0 160px rgba(245, 197, 24, 0.25),
          0 0 260px rgba(245, 197, 24, 0.12);
        border-color: #fff;
      }
    }

    @keyframes orbActive {
      0% {
        transform: scale(1.05);
        box-shadow:
          0 0 80px rgba(245, 197, 24, 0.6),
          0 0 160px rgba(245, 197, 24, 0.25),
          0 0 260px rgba(245, 197, 24, 0.12);
        border-color: #fff;
      }
      100% {
        transform: scale(1.1);
        box-shadow:
          0 0 100px rgba(245, 197, 24, 0.8),
          0 0 200px rgba(245, 197, 24, 0.35),
          0 0 300px rgba(245, 197, 24, 0.15);
        border-color: var(--yellow);
      }
    }

    #status-text{
      font-size: 0.86rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
      color: var(--yellow);
      opacity: 0.90;
      min-height: 1.2em;
    }

    #hint{
      font-size: 0.82rem;
      color: var(--muted2);
      text-align: center;
      line-height: 1.2;
      min-height: 1.1em;
      margin-top: -2px;
    }

    #footer {
      text-align: center;
      opacity: 0.60;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.2;
      margin-top: 2px;
    }

    #footer .brand { font-size: 0.82rem; }
    #footer .phone { font-size: 0.78rem; opacity: 0.9; margin-top: 4px; }

    body.starting #orb-container { pointer-events: none; opacity: 0.95; }

    /* Embedded: logo orb only — pinwheel squares live in parent vox-overlay.css */
    body.embedded {
      background: transparent;
    }

    body.embedded #overlay {
      padding: 0;
      background: transparent;
      pointer-events: none;
    }

    body.embedded #panel {
      width: 260px;
      height: 260px;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      pointer-events: auto;
      position: relative;
      display: block;
    }

    body.embedded #headline,
    body.embedded #footer,
    body.embedded #status-text,
    body.embedded #hint,
    body.embedded #stop-btn {
      display: none !important;
    }

    body.embedded #orb-container {
      width: 260px;
      height: 260px;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 1;
      pointer-events: auto;
    }

    body.embedded .orb {
      box-shadow: none;
      animation: orbBorderPulse 3s ease-in-out infinite;
      transform: scale(1) !important;
    }

    body.embedded #orb-container:hover .orb,
    body.embedded.active .orb,
    body.embedded.starting .orb {
      animation: orbBorderPulse 3s ease-in-out infinite;
      transform: scale(1) !important;
    }

    @keyframes orbBorderPulse {
      0%, 100% { border-color: var(--yellow); }
      50% { border-color: #fff; }
    }

    body.embedded #status-text.vox-error {
      display: block !important;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10004;
      max-width: 92%;
      text-transform: none;
      letter-spacing: 0.04em;
      font-size: 0.72rem;
      color: #ff8888;
      pointer-events: none;
    }

    #stop-btn {
      display: none;
      margin-top: 18px;
      padding: 12px 28px;
      border: 2px solid var(--yellow);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: var(--yellow);
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    #stop-btn:hover {
      background: var(--yellow);
      color: #111;
    }

    body.active #stop-btn,
    body.starting #stop-btn {
      display: inline-block;
    }
  </style>
</head>

<body class="idle">
  <div id="overlay">
    <div id="panel">
      <div id="headline">Click to Start a Conversation</div>

      <div id="orb-container" onclick="handleOrbClick()">
        <div class="orb"></div>
      </div>

      <div id="status-text"></div>
      <div id="hint">Click outside this box to return to the website</div>

      <button id="stop-btn" type="button" onclick="stopAndClose(event)">Stop Conversation</button>

      <div id="footer">
        <div class="brand">A1 Asphalt &amp; Sealing</div>
        <div class="phone">(618) 929-3301</div>
      </div>
    </div>
  </div>

  <script>
    let pc = null
    let localStream = null
    let remoteAudio = null
    let eventsDc = null
    let starting = false
    let sessionStarted = false
    let embedStarted = false
    let startLock = false
    let returningVisitor = false
    const isEmbedded = window.self !== window.top
    const statusEl = document.getElementById('status-text')
    const headlineEl = document.getElementById('headline')
    const hintEl = document.getElementById('hint')

    const WELCOME_LINE =
      "Hello, welcome to A1 Professional Asphalt and Sealing. I'm an artificial team member here to answer any questions you might have. How can I help you today?"
    const RETURN_LINE = 'Did you have another question?'

    function setBodyState(state) {
      if (isEmbedded) {
        document.body.className = state === 'idle' ? 'embedded' : 'embedded active'
        return
      }
      document.body.className = state
    }

    function setMicEnabled(enabled) {
      if (!localStream) return
      try {
        localStream.getAudioTracks().forEach(function (track) {
          track.enabled = enabled
        })
      } catch (e) {}
    }

    function setIdle() {
      setBodyState('idle')
      statusEl.textContent = ''
      statusEl.classList.remove('vox-error')
      headlineEl.classList.remove('hide-soft')
      hintEl.textContent = isEmbedded ? '' : 'Click outside this box to return to the website'
      starting = false
    }

    function setStarting() {
      setBodyState('starting')
      statusEl.textContent = isEmbedded ? '' : 'STARTING…'
      headlineEl.classList.remove('hide-soft')
      hintEl.textContent = isEmbedded ? '' : 'Click outside this box to return to the website'
    }

    function setActive() {
      setBodyState('active')
      starting = false
      statusEl.textContent = ''
      headlineEl.classList.add('hide-soft')
      hintEl.textContent = isEmbedded ? '' : 'Click Stop to end'
    }

    function showVoiceError(msg) {
      statusEl.textContent = msg
      statusEl.classList.add('vox-error')
      if (isEmbedded) {
        try { window.parent.postMessage({ type: 'voxtalk-error', message: msg }, '*') } catch (e) {}
      }
    }

    function friendlyMicError(err) {
      var name = err && err.name
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        return 'Microphone blocked. Tap the lock icon in your browser address bar, allow microphone for this site, then try again.'
      }
      if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        return 'No microphone found on this device.'
      }
      if (name === 'NotReadableError') {
        return 'Microphone is in use by another app. Close other apps using the mic and try again.'
      }
      return err && err.message ? err.message : 'Voice failed — check microphone permission and try again.'
    }

    // Capture mic with browser-side noise filtering focused on the near voice.
    // Mono + echo cancel + noise suppression + auto gain strips steady-state
    // room noise (HVAC, music, crowd). Falls back to plain audio if a phone
    // browser rejects the detailed constraints, so it never fails to start.
    async function getFilteredMic() {
      var filtered = {
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1,
          // Chrome/Android hints — ignored where unsupported, never required.
          googEchoCancellation: true,
          googNoiseSuppression: true,
          googNoiseSuppression2: true,
          googAutoGainControl: true,
          googHighpassFilter: true,
          googTypingNoiseDetection: true
        }
      }
      try {
        return await navigator.mediaDevices.getUserMedia(filtered)
      } catch (e) {
        if (e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError' ||
                  e.name === 'NotFoundError' || e.name === 'NotReadableError')) {
          throw e
        }
        return await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        })
      }
    }

    async function hardStop() {
      try {
        if (eventsDc && eventsDc.readyState === 'open') {
          try { eventsDc.send(JSON.stringify({ type: 'response.cancel' })) } catch (e) {}
        }
        eventsDc = null
        if (remoteAudio) {
          try {
            remoteAudio.pause()
            remoteAudio.srcObject = null
            remoteAudio.remove()
          } catch (e) {}
          remoteAudio = null
        }
        if (pc) { try { pc.close() } catch (e) {} pc = null }
        if (localStream) {
          try { localStream.getTracks().forEach(function (t) { t.stop() }) } catch (e) {}
          localStream = null
        }
      } finally {
        sessionStarted = false
        starting = false
        setIdle()
        if (isEmbedded) {
          try { window.parent.postMessage({ type: 'voxtalk-stopped' }, '*') } catch (e) {}
        }
      }
    }

    async function stopAndClose(e) {
      if (e) e.stopPropagation()
      await hardStop()
      embedStarted = false
      sessionStarted = false
      if (isEmbedded) {
        try { window.parent.postMessage({ type: 'voxtalk-close' }, '*') } catch (e) {}
      }
    }

    document.getElementById('overlay').addEventListener('click', async function (e) {
      if (isEmbedded) return
      if (e.target.id !== 'overlay') return
      await hardStop()
      try { window.parent.postMessage({ type: 'voxtalk-close' }, '*') } catch (e) {}
      try { window.close() } catch (e) {}
      try { history.back() } catch (e) {}
    })

    function handleOrbClick() {
      toggleAssistant()
    }

    async function toggleAssistant() {
      if (starting) return
      if (pc) {
        await stopAndClose()
        return
      }
      if (sessionStarted) return

      sessionStarted = true
      starting = true
      setStarting()

      try {
        function setupRealtimeChannel(peerConnection) {
          const dc = peerConnection.createDataChannel('oai-events')
          eventsDc = dc
          let greetingSent = false
          let greetingGenerationDone = false
          let listeningOn = false
          let listenTimer = null

          function enableListening() {
            if (listeningOn || !pc) return
            listeningOn = true
            setMicEnabled(true)
            dc.send(JSON.stringify({
              type: 'session.update',
              session: {
                type: 'realtime',
                audio: {
                  input: {
                    // Higher threshold = ignore background chatter/ambient
                    // noise so the speaker in front of the device is heard
                    // and end-of-speech is detected even in a noisy room.
                    turn_detection: {
                      type: 'server_vad',
                      threshold: 0.65,
                      silence_duration_ms: 1500,
                      prefix_padding_ms: 300,
                      create_response: true,
                      interrupt_response: false
                    }
                  }
                }
              }
            }))
          }

          function scheduleListening(ms) {
            if (listeningOn) return
            if (listenTimer) clearTimeout(listenTimer)
            listenTimer = setTimeout(function () {
              listenTimer = null
              enableListening()
            }, ms)
          }

          dc.addEventListener('message', function (event) {
            let msg
            try { msg = JSON.parse(event.data) } catch (e) { return }

            if (msg.type === 'session.created' && !greetingSent) {
              greetingSent = true
              setMicEnabled(false)
              var line = returningVisitor ? RETURN_LINE : WELCOME_LINE
              dc.send(JSON.stringify({
                type: 'session.update',
                session: {
                  type: 'realtime',
                  audio: { input: { turn_detection: null } }
                }
              }))
              dc.send(JSON.stringify({
                type: 'response.create',
                response: {
                  output_modalities: ['audio'],
                  instructions: 'Say exactly this, word for word, then stop: "' + line + '"'
                }
              }))
              return
            }

            if (msg.type === 'response.done' && greetingSent && !listeningOn) {
              greetingGenerationDone = true
              return
            }

            if (
              msg.type === 'output_audio_buffer.stopped' &&
              greetingGenerationDone &&
              !listeningOn
            ) {
              if (isEmbedded) {
                try { window.parent.postMessage({ type: 'voxtalk-greeting-done' }, '*') } catch (e) {}
              }
              scheduleListening(1000)
            }
          })
        }

        pc = new RTCPeerConnection()
        setupRealtimeChannel(pc)

        remoteAudio = document.createElement('audio')
        remoteAudio.autoplay = true
        remoteAudio.playsInline = true
        document.body.appendChild(remoteAudio)

        pc.ontrack = function (e) {
          if (remoteAudio.srcObject !== e.streams[0]) {
            remoteAudio.srcObject = e.streams[0]
          }
          remoteAudio.play().catch(function (err) { console.error('audio play', err) })
        }

        localStream = await getFilteredMic()
        setMicEnabled(false)
        pc.addTrack(localStream.getTracks()[0])

        const offer = await pc.createOffer()
        await pc.setLocalDescription(offer)

        const sdpResponse = await fetch('/session', {
          method: 'POST',
          body: offer.sdp,
          headers: { 'Content-Type': 'application/sdp' }
        })

        if (!sdpResponse.ok) {
          throw new Error(await sdpResponse.text())
        }

        const answer = { type: 'answer', sdp: await sdpResponse.text() }
        await pc.setRemoteDescription(answer)
        setActive()
      } catch (err) {
        console.error(err)
        if (remoteAudio) {
          try {
            remoteAudio.pause()
            remoteAudio.srcObject = null
            remoteAudio.remove()
          } catch (e) {}
          remoteAudio = null
        }
        eventsDc = null
        pc = null
        if (localStream) {
          try { localStream.getTracks().forEach(function (t) { t.stop() }) } catch (e) {}
          localStream = null
        }
        sessionStarted = false
        embedStarted = false
        setIdle()
        showVoiceError(friendlyMicError(err))
      }
    }

    async function startWhenVisible() {
      if (startLock || embedStarted || pc || starting || sessionStarted) return
      startLock = true
      embedStarted = true
      try {
        await toggleAssistant()
      } finally {
        startLock = false
      }
    }

    if (isEmbedded) {
      setBodyState('idle')
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'voxtalk-start') {
          returningVisitor = !!e.data.returning
          startWhenVisible()
        }
        if (e.data && e.data.type === 'voxtalk-stop') stopAndClose()
      })
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden' && (pc || starting)) stopAndClose()
      })
      window.addEventListener('pagehide', function () {
        if (pc || starting) stopAndClose()
      })
      try { window.parent.postMessage({ type: 'voxtalk-ready' }, '*') } catch (e) {}
    } else {
      setIdle()
    }
  </script>
</body>
</html>
