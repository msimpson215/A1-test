<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Talk with A1 Professional Asphalt</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--yellow:#F5C518;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#040404;color:#fff;font-family:'Barlow',sans-serif;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;}
.orb-container{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.orb{width:280px;height:280px;border-radius:50%;background:url('A1__asphalt_logo.jpeg') center/70% no-repeat;background-color:#111;border:3px solid var(--yellow);box-shadow:0 0 60px rgba(245,197,24,0.4),0 0 120px rgba(245,197,24,0.15),0 0 200px rgba(245,197,24,0.08);animation:orbPulse 3s ease-in-out infinite;margin-bottom:28px;}
@keyframes orbPulse{0%,100%{transform:scale(1);box-shadow:0 0 60px rgba(245,197,24,0.4),0 0 120px rgba(245,197,24,0.15),0 0 200px rgba(245,197,24,0.08);border-color:var(--yellow);}50%{transform:scale(1.05);box-shadow:0 0 80px rgba(245,197,24,0.6),0 0 160px rgba(245,197,24,0.25),0 0 260px rgba(245,197,24,0.12);border-color:#fff;}}
.start-text{color:var(--yellow);font-size:1.2rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;transition:opacity 0.3s;}
.sub-text{color:#ffffff;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;}
.chat-frame{display:none;width:90vw;max-width:440px;height:70vh;border:none;border-radius:16px;box-shadow:0 0 80px rgba(245,197,24,0.3);}
.back-btn{display:none;margin-top:20px;color:#ffffff;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.14em;cursor:pointer;background:none;border:none;transition:color 0.2s;}
.back-btn:hover{color:var(--yellow);}
.powered{position:fixed;bottom:20px;color:#ffffff;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="orb-container" id="orbContainer" onclick="startChat()">
  <div class="orb" id="orb"></div>
  <div class="start-text" id="startText">Click to Start a Conversation</div>
  <div class="sub-text">A1 Professional Asphalt &amp; Sealing</div>
</div>
<iframe id="chatFrame" class="chat-frame" src="about:blank" title="A1 AI Team Member" allow="microphone *; autoplay *"></iframe>
<button class="back-btn" id="backBtn" onclick="resetChat()">← Back</button>
<div class="powered">Powered by Axon AI</div>
<script>
var VOICE_URL = '/voice/'
var chatFrame = document.getElementById('chatFrame')
var wantStart = false

function postStart() {
  if (!chatFrame.contentWindow) return
  try { chatFrame.contentWindow.postMessage({ type: 'voxtalk-start' }, '*') } catch (e) {}
}

function postStop() {
  if (!chatFrame.contentWindow) return
  try { chatFrame.contentWindow.postMessage({ type: 'voxtalk-stop' }, '*') } catch (e) {}
}

function loadVoice() {
  if (chatFrame.src && chatFrame.src.indexOf('/voice') !== -1) return
  chatFrame.src = VOICE_URL
}

window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'voxtalk-ready') return
  chatFrame.setAttribute('data-vox-ready', '1')
  if (wantStart) postStart()
})

function startChat() {
  document.getElementById('orbContainer').style.display = 'none'
  document.getElementById('backBtn').style.display = 'block'
  chatFrame.style.display = 'block'
  wantStart = true

  if (chatFrame.getAttribute('data-vox-ready') === '1') {
    postStart()
    return
  }

  loadVoice()
}

function resetChat() {
  wantStart = false
  postStop()
  setTimeout(function () {
    chatFrame.removeAttribute('data-vox-ready')
    chatFrame.src = 'about:blank'
    chatFrame.style.display = 'none'
    document.getElementById('orbContainer').style.display = 'flex'
    document.getElementById('backBtn').style.display = 'none'
  }, 450)
}
</script>
</body>
</html>
