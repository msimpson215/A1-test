services:
  - type: web
    name: a1-test
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: a1-asphalt-voxtalk-3
          envVarKey: OPENAI_API_KEY
